<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none">
  <defs>
    <style>
      .term-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; }
      .header-title { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #78726D; letter-spacing: 0.06em; }
      .cmd-prompt { fill: #9E1B32; font-weight: 700; }
      .cmd-user { fill: #FAF9F6; font-weight: 600; }
      .cmd-str { fill: #FAF9F6; font-weight: 500; }
      
      .log-ts { fill: #78726D; }
      .log-tag { fill: #B81D33; font-weight: 700; }
      .log-entity { fill: #FAF9F6; font-weight: 600; }
      .log-meta { fill: #A8A29E; }
      .log-dim { fill: #5A5550; }
      .log-val-accent { fill: #9E1B32; font-weight: 600; }
      .log-ok { fill: #FAF9F6; font-weight: 700; }

      @keyframes termBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: termBlink 1.1s step-end infinite; }

      @keyframes logReveal {
        0% { opacity: 0; transform: translateY(2px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .line-1 { animation: logReveal 0.25s ease-out forwards 0.2s; opacity: 0; }
      .line-2 { animation: logReveal 0.25s ease-out forwards 0.4s; opacity: 0; }
      .line-3 { animation: logReveal 0.25s ease-out forwards 0.6s; opacity: 0; }
      .line-4 { animation: logReveal 0.25s ease-out forwards 0.8s; opacity: 0; }
      .line-5 { animation: logReveal 0.25s ease-out forwards 1.0s; opacity: 0; }
      .line-6 { animation: logReveal 0.25s ease-out forwards 1.2s; opacity: 0; }
      .line-7 { animation: logReveal 0.25s ease-out forwards 1.4s; opacity: 0; }
    </style>
  </defs>

  <!-- Terminal Window Chrome -->
  <rect width="1000" height="340" fill="#0A0808"/>
  <rect x="0.5" y="0.5" width="999" height="339" fill="none" stroke="#261C1E" stroke-width="1"/>

  <!-- Terminal Header Strip -->
  <rect x="1" y="1" width="998" height="34" fill="#120E0F"/>
  <line x1="1" y1="35" x2="999" y2="35" stroke="#261C1E" stroke-width="1"/>

  <!-- Header Window Dots -->
  <circle cx="20" cy="18" r="4.5" fill="#9E1B32"/>
  <circle cx="36" cy="18" r="4.5" fill="#261C1E"/>
  <circle cx="52" cy="18" r="4.5" fill="#261C1E"/>

  <!-- Header Center Tab -->
  <g transform="translate(72, 8)">
    <rect width="360" height="20" fill="#0A0808" stroke="#261C1E" stroke-width="1"/>
    <text x="12" y="14" class="header-title">ubaid@legion-canary: ~/ops-telemetry --zsh</text>
  </g>

  <!-- Header Right Status -->
  <text x="792" y="22" class="header-title">DAEMON: <tspan fill="#FAF9F6">ACTIVE</tspan> // PID: <tspan fill="#9E1B32">4091</tspan> // SHIFT: <tspan fill="#FAF9F6">ONCALL</tspan></text>

  <!-- Terminal Body Content -->
  <g transform="translate(24, 62)" class="term-text">
    <!-- Prompt Command Line -->
    <g class="line-1">
      <text x="0" y="0">
        <tspan class="cmd-prompt">legion-canary::</tspan><tspan class="cmd-user">ubaid</tspan><tspan class="log-dim"> [~/ops-telemetry] </tspan><tspan class="cmd-prompt">#</tspan>
        <tspan class="cmd-str" dx="8">exec ./diagnostics/dump-operational-receipts.sh --strict --target=production</tspan>
      </text>
    </g>

    <!-- Divider Trace Line -->
    <g class="line-2">
      <line x1="0" y1="14" x2="952" y2="14" stroke="#261C1E" stroke-width="1" stroke-dasharray="4 4"/>
    </g>

    <!-- Receipt 1: FlowGuard -->
    <g class="line-3" transform="translate(0, 36)">
      <text x="0" y="0">
        <tspan class="log-ts">[00.012s]</tspan>
        <tspan class="log-tag" dx="8">daemon:</tspan>
        <tspan class="log-entity" dx="6">flowguard-crowd-engine</tspan>
        <tspan class="log-meta" dx="8">(mode=</tspan><tspan class="log-val-accent">OFFLINE_FIRST</tspan><tspan class="log-meta">, env=</tspan><tspan class="log-ok">GUJARAT_METRO_ONBOARD</tspan><tspan class="log-meta">, routing=</tspan><tspan class="log-ok">DIJKSTRA</tspan><tspan class="log-meta">)</tspan>
      </text>
    </g>

    <!-- Receipt 2: Ahmedabad Metro Network -->
    <g class="line-4" transform="translate(0, 68)">
      <text x="0" y="0">
        <tspan class="log-ts">[00.019s]</tspan>
        <tspan class="log-tag" dx="8">dataset:</tspan>
        <tspan class="log-entity" dx="6">ahmedabad-metro-network</tspan>
        <tspan class="log-meta" dx="8">(nodes=</tspan><tspan class="log-ok">54_mapped</tspan><tspan class="log-meta">, schedule=</tspan><tspan class="log-ok">32k_json_canonical</tspan><tspan class="log-meta">, transit_api=</tspan><tspan class="log-val-accent">REVERSE_ENGINEERED</tspan><tspan class="log-meta">)</tspan>
      </text>
    </g>

    <!-- Receipt 3: High-Density Fintech -->
    <g class="line-5" transform="translate(0, 100)">
      <text x="0" y="0">
        <tspan class="log-ts">[00.024s]</tspan>
        <tspan class="log-tag" dx="8">ui-core:</tspan>
        <tspan class="log-entity" dx="6">fintech-workspace</tspan>
        <tspan class="log-meta" dx="8">(precision=</tspan><tspan class="log-val-accent">decimal_strict</tspan><tspan class="log-meta">, nav=</tspan><tspan class="log-ok">keyboard_only</tspan><tspan class="log-meta">, dom_overhead=</tspan><tspan class="log-ok">zero_virtualized</tspan><tspan class="log-meta">, latency=</tspan><tspan class="log-val-accent">&lt;16ms</tspan><tspan class="log-meta">)</tspan>
      </text>
    </g>

    <!-- Receipt 4: Engines Cluster -->
    <g class="line-6" transform="translate(0, 132)">
      <text x="0" y="0">
        <tspan class="log-ts">[00.031s]</tspan>
        <tspan class="log-tag" dx="8">engines:</tspan>
        <tspan class="log-entity" dx="6">campus-sync</tspan>
        <tspan class="log-meta" dx="6">(conflict_solver=</tspan><tspan class="log-ok">active</tspan><tspan class="log-meta">)</tspan>
        <tspan class="log-dim" dx="6">|</tspan>
        <tspan class="log-entity" dx="6">veda-hms</tspan>
        <tspan class="log-meta" dx="6">(fefo_stock=</tspan><tspan class="log-ok">verified</tspan><tspan class="log-meta">)</tspan>
        <tspan class="log-dim" dx="6">|</tspan>
        <tspan class="log-entity" dx="6">talent-lens-parser</tspan>
        <tspan class="log-meta" dx="6">(stream=</tspan><tspan class="log-ok">bounded</tspan><tspan class="log-meta">)</tspan>
      </text>
    </g>

    <!-- Receipt 5: Runtime & Chaos Benchmark -->
    <g class="line-7" transform="translate(0, 164)">
      <text x="0" y="0">
        <tspan class="log-ts">[00.038s]</tspan>
        <tspan class="log-tag" dx="8">runtime:</tspan>
        <tspan class="log-entity" dx="6">nextjs + typescript + tailwind + gemini-agents</tspan>
        <tspan class="log-dim" dx="6">|</tspan>
        <tspan class="log-meta" dx="6">geo-bollard-heuristic=</tspan><tspan class="log-ok">READY</tspan>
        <tspan class="log-dim" dx="6">|</tspan>
        <tspan class="log-meta" dx="6">sre-dag=</tspan><tspan class="log-val-accent">17_SVC_PASS</tspan>
      </text>
    </g>

    <!-- Live Telemetry Prompt with blinking cursor -->
    <g transform="translate(0, 210)">
      <text x="0" y="0">
        <tspan class="cmd-prompt">legion-canary::</tspan><tspan class="cmd-user">ubaid</tspan><tspan class="log-dim"> [~/ops-telemetry] </tspan><tspan class="cmd-prompt">#</tspan>
        <tspan class="log-meta" dx="8">status: awaiting next operational directive</tspan>
      </text>
      <rect x="424" y="-11" width="7" height="14" fill="#9E1B32" class="cursor"/>
    </g>
  </g>
</svg>
