            <rect width="84" height="26" rx="13" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glow)">
               <animate attributeName="stroke" values="rgba(255,255,255,0.08);url(#accentGradient);rgba(255,255,255,0.08)" dur="4s" begin="4.2s" repeatCount="indefinite"/>
            </rect>
            <text x="42.0" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Docker</text>
        </g>
        
        <g transform="translate(0, 70)" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.3s" fill="freeze"/>
            <rect width="102" height="26" rx="13" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glow)">
               <animate attributeName="stroke" values="rgba(255,255,255,0.08);url(#accentGradient);rgba(255,255,255,0.08)" dur="4s" begin="5.3s" repeatCount="indefinite"/>
            </rect>
            <text x="51.0" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Postgres</text>
        </g>
        
        <g transform="translate(112, 70)" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
            <rect width="57" height="26" rx="13" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glow)">
               <animate attributeName="stroke" values="rgba(255,255,255,0.08);url(#accentGradient);rgba(255,255,255,0.08)" dur="4s" begin="3.4s" repeatCount="indefinite"/>
            </rect>
            <text x="28.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Git</text>
        </g>
        
        <g transform="translate(179, 70)" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.5s" fill="freeze"/>
            <rect width="75" height="26" rx="13" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glow)">
               <animate attributeName="stroke" values="rgba(255,255,255,0.08);url(#accentGradient);rgba(255,255,255,0.08)" dur="4s" begin="4.5s" repeatCount="indefinite"/>
            </rect>
            <text x="37.5" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Figma</text>
