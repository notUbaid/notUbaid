<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
    <defs>
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="subtleGlow">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#30363D"/>
            <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.8"/>
        </linearGradient>
    </defs>

    <!-- Base Canvas -->
    <rect width="1180" height="610" fill="#0D1117" rx="12"/>

    <!-- Terminal Window -->
    <rect x="20" y="20" width="1140" height="570" fill="#010409" rx="8" stroke="url(#borderGrad)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="20" y="20" width="1140" height="30" fill="#30363D" opacity="0.2" rx="8" clip-path="inset(0 0 100px 0)"/>
    <circle cx="45" cy="35" r="5" fill="#FF5F56"/>
    <circle cx="65" cy="35" r="5" fill="#FFBD2E"/>
    <circle cx="85" cy="35" r="5" fill="#27C93F"/>
    
    <text x="590" y="40" font-family="monospace" font-size="12" fill="#8B949E" text-anchor="middle">notUbaid@ship ~ /profile.sh</text>
    <text x="1140" y="40" font-family="monospace" font-size="12" fill="#8B949E" text-anchor="end">_ □ x </text>

