<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="320" viewBox="0 0 1180 320" fill="none">
  <defs>
    <style>
      .meta-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #78726D; letter-spacing: 0.08em; }
      .meta-accent { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #9E1B32; font-weight: 700; letter-spacing: 0.08em; }
      .title-main { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 42px; font-weight: 900; fill: #FAF9F6; letter-spacing: -0.035em; }
      .alias-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #B81D33; letter-spacing: 0.14em; }
      .desc-line { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 700; fill: #FAF9F6; letter-spacing: 0.05em; }
      .desc-sub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #78726D; letter-spacing: 0.03em; }
      .panel-header { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; fill: #B81D33; letter-spacing: 0.14em; }
      .data-key { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; fill: #78726D; letter-spacing: 0.05em; }
      .data-val { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; fill: #FAF9F6; font-weight: 600; letter-spacing: 0.04em; }
      .data-val-accent { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; fill: #B81D33; font-weight: 700; letter-spacing: 0.04em; }
      .footer-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #78726D; letter-spacing: 0.06em; }
      
      @keyframes pulseDark {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .pulse-dot { animation: pulseDark 2.4s ease-in-out infinite; transform-origin: 1098px 108px; }
    </style>
    <pattern id="grid-pattern-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#261C1E" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1180" height="320" fill="#0A0808"/>
  <rect x="12" y="12" width="1156" height="296" fill="url(#grid-pattern-dark)"/>

  <!-- Outer Structural Hairline Border -->
  <rect x="12" y="12" width="1156" height="296" fill="none" stroke="#261C1E" stroke-width="1"/>

  <!-- Corner Registration Marks -->
  <path d="M 6 12 H 18 M 12 6 V 18" stroke="#9E1B32" stroke-width="1.2"/>
  <path d="M 1162 12 H 1174 M 1168 6 V 18" stroke="#9E1B32" stroke-width="1.2"/>
  <path d="M 6 308 H 18 M 12 302 V 314" stroke="#9E1B32" stroke-width="1.2"/>
  <path d="M 1162 308 H 1174 M 1168 302 V 314" stroke="#9E1B32" stroke-width="1.2"/>

  <!-- Header Divider -->
  <line x1="12" y1="48" x2="1168" y2="48" stroke="#261C1E" stroke-width="1"/>
  
  <!-- Header Telemetry Row -->
  <text x="32" y="33" class="meta-mono">SYS_ID: <tspan fill="#FAF9F6">UNK-8902</tspan> // ARCH_CLASS: <tspan fill="#FAF9F6">STAFF_SYSTEMS</tspan></text>
  <text x="440" y="33" class="meta-mono">COORD: <tspan fill="#FAF9F6">23.0225° N, 72.5714° E</tspan> // AMD-GN</text>
  <text x="948" y="33" class="meta-accent">TELEMETRY: LIVE // FRAME: &lt;6.94ms</text>

  <!-- Header / Body Intersection Registration Mark -->
  <path d="M 724 48 H 736 M 730 42 V 54" stroke="#9E1B32" stroke-width="1"/>

  <!-- Vertical Column Divider -->
  <line x1="730" y1="48" x2="730" y2="274" stroke="#261C1E" stroke-width="1"/>

  <!-- Left Content Panel -->
  <g transform="translate(36, 76)">
    <text x="0" y="14" class="meta-mono">// OPERATIONAL IDENTITY</text>
    <text x="0" y="58" class="title-main">UBAID NAEEM KHAN</text>
    <text x="0" y="86" class="alias-mono">[notUbaid] :: SYSTEMS &amp; HIGH-DENSITY INTERFACES</text>
    
    <line x1="0" y1="106" x2="660" y2="106" stroke="#261C1E" stroke-width="1"/>

    <text x="0" y="132" class="desc-line">SYSTEMS, HIGH-DENSITY INTERFACES &amp; OPERATIONAL TOOLING</text>
    <text x="0" y="156" class="desc-sub">Reverse-Engineered transit network // Offline-first crowd engine // Sub-frame UI latency</text>
    <text x="0" y="176" class="desc-sub">Deterministic finance workbenches // RL chaos triage environments</text>
  </g>

  <!-- Right Telemetry Panel Background -->
  <rect x="731" y="49" width="436" height="224" fill="#120E0F"/>

  <!-- Right Telemetry Panel Content -->
  <g transform="translate(756, 74)">
    <text x="0" y="14" class="panel-header">// SYSTEM TELEMETRY &amp; SPECS</text>
    <line x1="0" y1="26" x2="384" y2="26" stroke="#261C1E" stroke-width="1"/>

    <text x="0" y="48" class="data-key">STATUS:</text>
    <text x="140" y="48" class="data-val-accent">SHIPPING [CANARY]</text>
    <circle cx="342" cy="44" r="3.5" fill="#9E1B32" class="pulse-dot"/>

    <text x="0" y="74" class="data-key">TRANSIT_GRAPH:</text>
    <text x="140" y="74" class="data-val">54 NODES // DIJKSTRA O(V+E)</text>

    <text x="0" y="100" class="data-key">ARCHITECTURE:</text>
    <text x="140" y="100" class="data-val">OFFLINE_FIRST // STRICT_DOM</text>

    <text x="0" y="126" class="data-key">RL_BENCHMARK:</text>
    <text x="140" y="126" class="data-val">17-SVC CASCADE DAG</text>

    <text x="0" y="152" class="data-key">UI_LATENCY:</text>
    <text x="140" y="152" class="data-val">&lt;16ms TARGET [SUB-FRAME]</text>

    <text x="0" y="178" class="data-key">RUNTIME_ENV:</text>
    <text x="140" y="178" class="data-val">BARE_METAL + CLOUD_EDGE</text>
  </g>

  <!-- Footer Divider -->
  <line x1="12" y1="274" x2="1168" y2="274" stroke="#261C1E" stroke-width="1"/>

  <!-- Footer Status Row -->
  <text x="32" y="295" class="footer-mono">PROTOCOL: <tspan fill="#FAF9F6">DETERMINISTIC</tspan> // ANTI_SLOP: <tspan fill="#FAF9F6">ENFORCED</tspan> // AUDIT: <tspan fill="#FAF9F6">FIELD_RECEIPTS_GROUNDED</tspan></text>
  <text x="912" y="295" class="footer-mono">CLASSIFICATION: <tspan fill="#B81D33">PUBLIC_FIELD_LOG</tspan></text>
</svg>
