name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: notUbaid
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7B1113&color_dots=#E2DDD5,#E5989B,#C41E3A,#9E1B32,#4A0A10
            dist/github-contribution-grid-snake-dark.svg?color_snake=#B81D33&color_dots=#261C1E,#4A0A10,#7B1113,#9E1B32,#C41E3A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update snake animation [skip ci]"
          branch: main
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: Author <actions@github.com>
